[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymusic"
version = "2.0.0"
description = "A modern music player and library manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PyMusic contributors" }]
keywords = ["music", "player", "audio", "library", "qt", "vlc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

dependencies = [
    "SQLAlchemy>=2.0",
    "mutagen>=1.47",
    "python-vlc>=3.0.20",
    "requests>=2.31",
    "PySide6>=6.6",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
pymusic = "pymusic.cli:main"
pymusic-gui = "pymusic.gui.app:main"

[project.gui-scripts]
pymusic-app = "pymusic.gui.app:main"

[tool.setuptools]
packages = ["pymusic", "pymusic.gui"]
include-package-data = true

[tool.setuptools.package-data]
pymusic = ["logo.bmp", "*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
